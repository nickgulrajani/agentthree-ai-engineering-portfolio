[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentthree-ai-architect-lab"
version = "0.1.0"
description = "Hands-On AI Architecture Lab — governed lending assistant (local, simulated, $0 cloud)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentThree" }]
dependencies = [
  "click>=8.1.7",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
agentthree-architect = "agentthree_ai_architect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
