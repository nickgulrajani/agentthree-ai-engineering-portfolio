[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentthree-agent-eval"
version = "0.1.0"
description = "Offline agent evaluation harness: task suite, trajectories, regression gates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentThree" }]
dependencies = [
  "PyYAML>=6.0.1",
  "click>=8.1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
agentthree-agent-eval = "agentthree_agent_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
