name: Zero Trust Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily health check at 14:00 UTC. Runs the same verify/demo; does not create commits.
  schedule:
    - cron: "0 14 * * *"

# No cloud credentials. No terraform apply. $0 cloud spend.
permissions:
  contents: read

jobs:
  verify:
    name: Rego · allow/deny integration · Terraform mock tests · demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 0.64.1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - run: make setup
      - run: make verify
      - name: Run demo (fails if any scenario is unexpected)
        run: make demo
        env:
          COLUMNS: "140"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero-trust-evidence
          path: artifacts/
