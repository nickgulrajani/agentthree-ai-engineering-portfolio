name: Portfolio Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily health check at 14:00 UTC. Runs the same test suites; does not create commits.
  schedule:
    - cron: "0 14 * * *"

# No cloud credentials. No terraform apply. Local / CI simulation only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: All projects · pytest (+ OPA when available)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: open-policy-agent/setup-opa@v2
        with:
          version: 0.64.1

      - name: make verify
        run: make verify
