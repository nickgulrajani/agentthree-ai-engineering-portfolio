[project]
name = "agentthree-ai-devsecops"
version = "0.1.0"
description = "Zero-billing AI DevSecOps pipeline: Terraform/Checkov, pytest, MCP contracts, agent eval gates, Trivy, approvals, rollback dry-run"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pytest>=8.0.0",
  "pyyaml>=6.0",
  "checkov>=3.2.0",
  "jsonschema>=4.22.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
